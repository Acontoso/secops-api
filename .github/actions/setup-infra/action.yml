name: Setup infrastructure tools
description: Install pinned Terraform and checksum-verified Terragrunt
inputs:
  environment:
    description: Optional application environment to configure (dev or prod)
    default: ''
  variables:
    description: GitHub variables as JSON, used only when environment is set
    default: '{}'
runs:
  using: composite
  steps:
    - name: Load environment configuration
      if: inputs.environment != ''
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
        VARS_JSON: ${{ inputs.variables }}
      run: python3 .github/scripts/configure.py
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: '1.15.6'
        terraform_wrapper: false
    - name: Install Terragrunt
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$(mktemp -d)"
        trap 'rm -rf "$install_dir"' EXIT
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          https://github.com/gruntwork-io/terragrunt/releases/download/v1.0.8/terragrunt_linux_amd64 \
          --output "$install_dir/terragrunt"
        printf '%s  %s\n' 1ef75087d0a5db968a5e1801f40a7bf5ebdc145ad89ae72c584201fa301d15f4 "$install_dir/terragrunt" \
          | sha256sum --check --strict
        sudo install -m 0755 "$install_dir/terragrunt" /usr/local/bin/terragrunt
